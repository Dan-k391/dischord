name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['android-v*']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the build commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Verify the pinned Gradle wrapper and release version
        run: |
          echo '498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  android/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
          chmod +x android/gradlew
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            version=$(sed -n 's/^dischordVersionName=//p' android/gradle.properties)
            [[ "$GITHUB_REF_NAME" == "android-v$version" ]] || { echo 'The Android tag must match dischordVersionName.' >&2; exit 1; }
          fi
      - name: Build and lint the unsigned APK
        working-directory: android
        run: ./gradlew --no-daemon --console=plain assembleRelease lintRelease
      - name: Prepare the build for local signing
        run: |
          mkdir -p dist/android
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/android/Dischord-Android-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/android/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 dist/android/Dischord-Android-unsigned.apk
          cd dist/android
          sha256sum Dischord-Android-unsigned.apk apksigner.jar > SHA256SUMS-unsigned.txt
      - name: Upload the unsigned build and public signing tool
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Dischord-Android-unsigned
          path: |
            dist/android/Dischord-Android-unsigned.apk
            dist/android/apksigner.jar
            dist/android/SHA256SUMS-unsigned.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Android-lint
          path: android/app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14
