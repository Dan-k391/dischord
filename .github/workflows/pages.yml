name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify chat, file transfers and media controls
        run: |
          node --check app.js
          node --check file-transfer.js
          node --check image-preview.js
          node --check screen-quality.js
          node tests/media.test.js
          node tests/files.test.js
          node tests/chat.test.js
          node tests/image-preview.test.js
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html app.js file-transfer.js image-preview.js screen-quality.js style.css icon.svg _site/
          cp -r rnnoise _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
